
<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVRY - Music</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: url('bg.jpg') no-repeat center center fixed;
            background-size: cover;
            padding: 20px 0;
        }

        .container {
            width: 90%;
            max-width: 380px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .cover-art {
            width: 240px;
            height: 240px;
            border-radius: 20px;
            object-fit: cover;
            box-shadow: 0 0 35px 12px rgba(255, 0, 0, 0.75);
            margin-bottom: 20px;
        }

        .title {
            font-size: 2.2rem;
            font-weight: 900;
            color: #ff0000;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.9);
            margin-bottom: 4px;
        }

        .subtitle {
            font-size: 0.95rem;
            color: #ffffff;
            margin-bottom: 25px;
            text-shadow: 1px 1px 5px rgba(0, 0, 0, 0.9);
            font-weight: 500;
        }

        .links-card {
            background: #ffffff;
            border-radius: 18px;
            width: 100%;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        .link-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid #f0f0f0;
            text-decoration: none;
            color: #000000;
        }

        .link-item:last-child { border-bottom: none; }

        .platform-info {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            font-size: 1rem;
        }

        .platform-icon { width: 24px; height: 24px; }

        .btn-play {
            background-color: #e5e5e5;
            color: #000000;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="cover.jpg" alt="EVRY" class="cover-art">

        <h1 class="title">EVRY</h1>
        <p class="subtitle">Choose music service</p>
